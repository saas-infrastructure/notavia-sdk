          type: string
          nullable: true

    # -------------------------------------------------------------------------
    # Slack
    # -------------------------------------------------------------------------

    SlackInstallationResponse:
      type: object
      description: Represents a Slack workspace installation for an environment.
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          description: Slack workspace team id (Txxxxxxxxx).
        team_name:
          type: string
        bot_user_id:
          type: string
          description: Slack bot user id (Uxxxxxxxxx).
        app_id:
          type: string
          nullable: true
        scopes:
          type: array
          items:
            type: string
          description: OAuth scopes granted to the bot token.
        auto_join_public_channels:
          type: boolean
          description: |
            When true the dispatcher will attempt to join a public channel
            (id starting with `C`) if the bot is not already a member.
        installed_at:
          type: string
          format: date-time
        installed_by_user_id:
          type: string
          format: uuid
          description: NotifyService user id who completed the OAuth flow.

    SlackInstallationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SlackInstallationResponse'

    UpdateSlackInstallationRequest:
      type: object
      required: [auto_join_public_channels]
      properties:
        auto_join_public_channels:
          type: boolean

    SendSlackTestRequest:
      type: object
      description: At least one of `slack_user_id` or `slack_channel_id` must be provided.
      properties:
        slack_user_id:
          type: string
          nullable: true
          description: Deliver as a DM to this Slack user id.
        slack_channel_id:
          type: string
          nullable: true
          description: Post to this Slack channel id.

