              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: CreateWorkflow
      tags: [Workflows]
      summary: Create a new workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          description: Workflow created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/workflows/{key}:
    get:
      operationId: GetWorkflow
      tags: [Workflows]
      summary: Get a workflow by key
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
      responses:
        '200':
          description: Workflow detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: DisableWorkflow
      tags: [Workflows]
      summary: Disable a workflow
      description: |
        Sets the workflow status to `Disabled`. Running runs continue to
        completion; new triggers are rejected with `404`.
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
      responses:
        '204':
          description: Workflow disabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{key}/versions:
    get:
      operationId: ListWorkflowVersions
      tags: [Workflows]
      summary: List all versions of a workflow
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
      responses:
        '200':
          description: Version list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowVersionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: CreateWorkflowVersion
      tags: [Workflows]
      summary: Create a new draft version
      description: |
        Parses the supplied JSON body against the workflow DSL. Returns the
        new version number. The version is left in `Draft` status; call
        `activate` to promote it.
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowVersionRequest'
      responses:
        '201':
          description: Draft version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{key}/versions/{n}:
    get:
      operationId: GetWorkflowVersion
      tags: [Workflows]
      summary: Get a specific workflow version
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Version detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{key}/versions/{n}/activate:
    post:
      operationId: ActivateWorkflowVersion
      tags: [Workflows]
      summary: Activate a draft version (or dry-run validate it)
      description: |
        Runs the full semantic validator against the version body. If
        `dry_run=true` the result is returned without persisting the status
        change — useful for the dashboard "Validate" button. Without
        `dry_run`, a valid version is promoted to `Active` and the previous
        active version (if any) is deactivated.
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
        - name: n
          in: path
          required: true
          schema:
            type: integer
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
          description: If true, validate without changing persistent state.
      responses:
        '200':
          description: Validation result (always returned; `valid` indicates whether activation succeeded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateWorkflowVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{key}/promote:
    post:
      operationId: PromoteWorkflow
      tags: [Workflows]
      summary: Promote a workflow's active version from Test to Live
      description: |
        Promotes the currently active Test version of the workflow into Live as
        a new version and activates it; the previous Live version is retained
        for rollback. Referenced templates that are missing or out of date in
        Live can be promoted in the same atomic operation via
        `include_templates`. With `dry_run` the diff and cascade candidates are
        returned without writing.
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteWorkflowRequest'
      responses:
        '200':
          description: Promotion result. The diff is returned for both dry runs and applied promotions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The promoted version failed semantic validation against the Live environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/workflows/{key}/trigger:
    post:
      operationId: TriggerWorkflow
      tags: [Workflows]
      summary: Trigger a workflow run
      description: |
        Creates a new `WorkflowRun` and enqueues the first step for
        execution. Idempotent when an `Idempotency-Key` header is supplied —
        re-sending the same key within 24 hours returns the original run
        without re-triggering.
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTriggerRequest'
            example:
              trigger_data:
                invoice_id: inv_42
                amount_cents: 9900
                user:
                  external_user_id: usr_1
                  email: alice@example.com
                  phone: "+15005550006"
                  name: Alice
      responses:
        '202':
          description: Run created and first step enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
        '200':
          description: Idempotent replay — existing run returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Trigger data failed `trigger_data_schema` validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/workflows/{key}/runs:
    get:
      operationId: ListWorkflowRuns
      tags: [Workflows]
      summary: List runs for a workflow with cursor pagination
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, waiting, completed, failed, cancelling, cancelled]
        - name: external_user_id
          in: query
          schema:
            type: string
          description: Filter runs whose trigger data contains this `external_user_id`.
        - name: page_token
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous list response.
      responses:
        '200':
          description: Paginated run list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowRunsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/{key}/events:
    post:
      operationId: PostWorkflowKeyEvent
      tags: [Workflows]
      summary: Post an event to all waiting runs of a workflow
      description: |
        Delivers `event_name` to every run of this workflow currently in
        `Waiting` status (paused on a `wait_for_event` step whose `event`
        and `match` filter matches). Returns the number of runs awoken.
      parameters:
        - $ref: '#/components/parameters/WorkflowKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostWorkflowEventRequest'
      responses:
        '200':
          description: Event delivered; awoken run count returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostWorkflowEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/workflows/runs/{runId}:
    get:
      operationId: GetWorkflowRun
      tags: [Workflows]
      summary: Get a run with the full step timeline
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Run detail with step timeline returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                workflow_key: invoice_paid
                version: 3
                status: Waiting
                current_step_id: step_wait_payment
                trigger_data: '{"invoice_id":"inv_42","user":{"external_user_id":"usr_1"}}'
                source: Production
                created_at: "2026-05-30T14:22:11Z"
                completed_at: null
                failure_reason: null
                steps:
                  - step_id: step_in_app
                    kind: Send
                    attempt_id: 1
                    status: Completed
                    outcome: Sent
                    notification_id: "1fa85f64-5717-4562-b3fc-2c963f66afa7"
                    output_json: '{"id":"1fa85f64-5717-4562-b3fc-2c963f66afa7","status":"Sent","sent_at":"2026-05-30T14:22:12Z"}'
                    next_step_id: step_wait_read
                    next_scheduled_at: null
                    started_at: "2026-05-30T14:22:12Z"
                    completed_at: "2026-05-30T14:22:12Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/runs/{runId}/cancel:
    post:
      operationId: CancelWorkflowRun
      tags: [Workflows]
      summary: Cancel an in-progress run
      description: |
        Transitions the run to `Cancelling` (or immediately `Cancelled` if
        already in a terminal-adjacent state). Any scheduled `wait_for_event`
        timeout jobs are cancelled. Running Hangfire step jobs detect the
        cancellation flag and terminate cleanly.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancellation requested; current status returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [cancelling, cancelled]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workflows/runs/{runId}/events:
    post:
      operationId: PostRunEvent
      tags: [Workflows]
      summary: Post an event to a specific run
      description: |
        Delivers `event_name` to a single run. Wakes the run if it is
        currently paused on a `wait_for_event` step whose `event` and
        `match` filter matches the posted data.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostWorkflowEventRequest'
      responses:
        '200':
          description: Event delivered; awoken run count returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostWorkflowEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflows/schema.json:
    get:
      operationId: GetWorkflowSchema
      tags: [Internal]
      summary: Fetch the workflow DSL JSON Schema
      description: |
        Returns the embedded `workflow.schema.json` resource. Used by the
        dashboard Monaco editor to provide structural validation and
        auto-complete. Anonymous access; cached aggressively
        (`Cache-Control: public, max-age=3600`). A `X-Schema-Sha256` response
        header carries the SHA-256 of the content for cache invalidation.
      security: []
      responses:
        '200':
          description: JSON Schema document returned.
          content:
            application/json:
              schema:
                type: object

  /status:
    get:
      operationId: GetServiceStatus
      tags: [Internal]
      summary: Public service status
      description: |
        Returns the current operational status of the service, per-component
        statuses, any active incidents, and incidents resolved within the last
        14 days. Anonymous access; no API key required. CORS-enabled for any
        origin (`InboxEmbeddable` policy).
      security: []
      responses:
        '200':
          description: Current service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatusResponse'

  /sso/discover:
    get:
      operationId: DiscoverSso
      tags: [Internal]
      summary: Discover the SSO configuration for an email address's domain
      description: |
        Given a work email, returns whether the email's domain has an active
        enterprise SSO configuration and, if so, which protocol and whether
        force-SSO is enabled. Used by the dashboard login page to offer a
        "Continue with SSO" button and to hide the password field when
        force-SSO is on. Anonymous access; returns `{ "hasSso": false }` for
        unknown domains so it does not double as an account-existence oracle.
      security: []
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Discovery result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasSso:
                    type: boolean
                  protocol:
                    type: string
                    nullable: true
                    enum: [saml, oidc]
                  orgName:
                    type: string
                    nullable: true
                  forceSso:
                    type: boolean
                required: [hasSso, forceSso]

# =============================================================================
# Components
# =============================================================================

components:

  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        API key issued per environment. Pass as `Authorization: Bearer <key>`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: .AspNetCore.Cookies
      description: Dashboard session cookie (used only by OAuth install/callback routes).
    inboxJwt:
      type: http
      scheme: bearer
      description: Short-lived inbox JWT issued by `POST /inbox/v1/tokens/verify`.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    WorkflowKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,99}$'
      description: Workflow key — lowercase alphanumeric + underscore, max 100 chars.

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: |
        Client-generated key (UUID recommended). Repeat requests with the same
        key within 24 hours return the original response without re-sending.

  responses:
    BadRequest:
      description: Validation or request error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Credentials do not have the required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict (e.g. duplicate key, idempotency collision).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:

    # -------------------------------------------------------------------------
    # Shared / primitives
    # -------------------------------------------------------------------------

    NotificationChannel:
      type: string
      description: Notification channel identifier.
      enum:
        - email
        - in_app
        - webhook
        - sms
        - slack
        - teams
        - discord

    NotificationChannelKebab:
      type: string
      description: Kebab-case channel identifier used in URL path segments and template body keys.
      enum:
        - email
        - in_app
        - sms
        - slack
        - teams
        - discord

    NotificationStatus:
      type: string
      enum:
        - queued
        - sending
        - sent
        - failed
        - suppressed
        - delivered
        - bounced
        - complained

    UsageResponse:
      type: object
      description: Current-period live usage and resolved plan limits.
      required: [plan, period_start, period_end, used_sends, hard_limit, by_channel]
      properties:
        plan:
          type: string
          description: Resolved plan key (e.g. `free`, `oem`).
        period_start:
          type: string
          format: date-time
          description: Inclusive UTC start of the current billing period (first of the month).
        period_end:
          type: string
          format: date-time
          description: Exclusive UTC end of the current billing period (first of the next month).
        included_sends:
          type: integer
          format: int64
          nullable: true
          description: Monthly included send allowance, or null for unmetered plans.
        used_sends:
          type: integer
          format: int64
          description: Live (non-test) sends consumed in the current period.
        remaining_sends:
          type: integer
          format: int64
          nullable: true
          description: Sends remaining before the cap, or null when there is no cap.
        hard_limit:
          type: boolean
          description: When true, sends are rejected once the included allowance is exhausted.
        by_channel:
          type: object
          description: Live sends consumed in the current period, keyed by lowercase channel name.
          additionalProperties:
            type: integer
            format: int64

    ErrorBody:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
        code:
          type: string
        message:
          type: string
        param:
          type: string
          nullable: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    SendTestResponse:
      type: object
      required: [notification_id]
      properties:
        notification_id:
          type: string
          format: uuid

    # -------------------------------------------------------------------------
    # Notifications
    # -------------------------------------------------------------------------

    Recipient:
      type: object
      description: |
        Identifies the notification target. At most one typed field should be
        set; the server selects the correct field based on `channel`.

        - **Email / SMS / In-app:** use `address` (email address, phone number E.164, or opaque external user id).
        - **Slack:** use `slack_user_id` (for DMs) or `slack_channel_id` (for channel posts).
        - **Teams / Discord:** use `endpoint` (the endpoint **key**, e.g. `"billing-alerts"`) or the legacy
          `teams_endpoint_id` / `discord_endpoint_id` (UUID of the configured endpoint).
        - `external_user_id` resolves the recipient via stored preference/inbox records.
        - `name` is used only for email `To:` display name and in-app display.
      properties:
        address:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        external_user_id:
          type: string
          nullable: true
        endpoint:
          type: string
          nullable: true
          description: |
            The **key** of a Discord or Teams endpoint (e.g. `"billing-alerts"`). Preferred over the legacy
            UUID fields. When set, `teams_endpoint_id` / `discord_endpoint_id` are ignored.
        slack_user_id:
          type: string
          nullable: true
          description: Slack user id (Uxxxxxxxx) for DM delivery. Mutually exclusive with `slack_channel_id`.
        slack_channel_id:
          type: string
          nullable: true
          description: Slack channel id (Cxxxxxxxx) for channel-post delivery. Mutually exclusive with `slack_user_id`.
        teams_endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the `TeamsWebhookEndpoint` to send to. Legacy — prefer `endpoint` (the key).
        discord_endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the `DiscordWebhookEndpoint` to send to. Legacy — prefer `endpoint` (the key).

    SendNotificationRequest:
      type: object
      required: [channel, recipient]
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipient:
          $ref: '#/components/schemas/Recipient'
        subject:
          type: string
          nullable: true
          description: Email subject line. Ignored for non-email channels.
        html_body:
          type: string
          nullable: true
          description: Inline HTML body. Ignored when `template_key` is set. Email/in-app only.
        text_body:
          type: string
          nullable: true
          description: Inline plain-text body. Email/SMS only.
        template_key:
          type: string
          nullable: true
          description: Key of a stored template. Required for Slack, Teams, Discord channels.
        template_data:
          type: object
          additionalProperties: true
          nullable: true
          description: Liquid template variables merged at render time.
        action_url:
          type: string
          nullable: true
          description: Optional CTA URL surfaced in in-app notifications.
        category:
          type: string
          nullable: true
          description: Preference category key. Suppresses the send when the recipient has opted out.
        attachments:
          type: array
          nullable: true
          description: |
            File attachments for email notifications (email channel only).
            Maximum 10 files; maximum 15 MB per file and 15 MB total.
            File content must be base64-encoded. Bytes are stored ephemerally and
            deleted after delivery — only metadata is retained in the audit log.
          items:
            $ref: '#/components/schemas/AttachmentInput'

    AttachmentInput:
      type: object
      required: [filename, content_type, content_base64]
      properties:
        filename:
          type: string
          maxLength: 255
          description: File name shown to the recipient, e.g. `"statement.pdf"`.
        content_type:
          type: string
          maxLength: 255
          description: MIME type of the file, e.g. `"application/pdf"`.
        content_base64:
          type: string
          description: Base64-encoded file content.

    AttachmentMetadata:
      type: object
      properties:
        filename:
          type: string
          description: Original file name.
        content_type:
          type: string
          description: MIME type of the file.
        size_bytes:
          type: integer
          format: int64
          description: File size in bytes.
        purged:
          type: boolean
          description: |
            True when the attachment bytes have been deleted from ephemeral storage after delivery.
            The metadata fields (filename, content_type, size_bytes) are always retained.

    NotificationEventDto:
      type: object
      properties:
        type:
          type: string
        occurred_at:
          type: string
          format: date-time
        detail:
          type: string
          nullable: true

    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/NotificationStatus'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipient:
          type: object
          properties:
            address:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        subject:
          type: string
          nullable: true
        html_body:
          type: string
          nullable: true
        text_body:
          type: string
          nullable: true
        template_key:
          type: string
          nullable: true
        template_data:
          type: object
          additionalProperties: true
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        action_url:
          type: string
          nullable: true
        attempt_count:
          type: integer
        created_at:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEventDto'
        suppression_reason:
          type: string
          nullable: true
        attachments:
          type: array
          description: |
            Metadata for files that were attached to this email notification.
            Bytes are purged after delivery; the `purged` flag indicates whether
            this has occurred. Omitted when the notification had no attachments.
          items:
            $ref: '#/components/schemas/AttachmentMetadata'

    NotificationPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        next_cursor:
          type: string
          nullable: true

    # -------------------------------------------------------------------------
    # Suppressions
    # -------------------------------------------------------------------------

    AddSuppressionRequest:
      type: object
      required: [address]
      properties:
        address:
          type: string

    SuppressionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
        reason:
          type: string
          enum: [hard_bounce, complaint, manual_add]
        source:
          type: string
          enum: [provider, manual]
        diagnostic_detail:
          type: string
          nullable: true
        triggering_notification_id:
          type: string
          format: uuid
          nullable: true
        suppressed_at:
          type: string
          format: date-time

    SuppressionPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SuppressionResponse'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true

    # -------------------------------------------------------------------------
    # Templates
    # -------------------------------------------------------------------------

    CreateTemplateRequest:
      type: object
      required: [key, name, subject_template, html_body_template]
      properties:
        key:
          type: string
        name:
          type: string
        subject_template:
          type: string
        html_body_template:
          type: string
        text_body_template:
          type: string
          nullable: true

    UpdateTemplateRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        subject_template:
          type: string
          nullable: true
        html_body_template:
          type: string
          nullable: true
        text_body_template:
          type: string
          nullable: true

    TemplateChannelBodyResponse:
      type: object
      description: |
        Per-channel body variant for a template. The channel-specific fields
        that apply depend on the channel:
        - **Email:** `subject_template` + `html_template` (+ optional `text_template`)
        - **InApp:** `html_template` (or `text_template` for plain-text in-app)
        - **SMS:** `text_template`
        - **Slack:** `structured_template` (Block Kit JSON as Liquid template)
        - **Teams:** `structured_template` (Adaptive Card v1.5 JSON as Liquid template)
        - **Discord:** `text_template` (content) and/or `structured_template` (embed JSON)
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        subject_template:
          type: string
          nullable: true
        text_template:
          type: string
          nullable: true
        html_template:
          type: string
          nullable: true
        structured_template:
          type: string
          nullable: true

    TemplateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        subject_template:
          type: string
          nullable: true
          description: Populated from the Email channel body for backwards compatibility.
        html_body_template:
          type: string
          nullable: true
          description: Populated from the Email channel body for backwards compatibility.
        text_body_template:
          type: string
          nullable: true
          description: Populated from the Email/SMS channel body for backwards compatibility.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        bodies:
          type: array
          description: Per-channel body variants. Replaces the legacy flat fields for new integrations.
          items:
            $ref: '#/components/schemas/TemplateChannelBodyResponse'
        body_channels:
          type: array
          description: Kebab-case list of channels for which a body variant exists.
          items:
            $ref: '#/components/schemas/NotificationChannelKebab'

    TemplatePage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TemplateResponse'
        next_cursor:
          type: string
          nullable: true

    PutTemplateBodyRequest:
      type: object
