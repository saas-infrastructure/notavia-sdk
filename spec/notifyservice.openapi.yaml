          description: First 30 characters of the webhook URL for recognition only — full URL never returned.
        flavour:
          type: string
          description: |
            Detected webhook flavour: `WorkflowsLogicApps`, `WorkflowsOffice`, or `LegacyConnector`.
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_failure_at:
          type: string
          format: date-time
          nullable: true
        last_failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    TeamsEndpointListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamsEndpointResponse'

    CreateTeamsEndpointRequest:
      type: object
      required: [label, webhook_url]
      properties:
        label:
          type: string
          description: Human-readable label for this endpoint in the dashboard.
        webhook_url:
          type: string
          format: uri
          description: |
            Teams Workflows or legacy connector webhook URL. Must match one of the
            three accepted patterns; legacy connector URLs are rejected with
            `teams_legacy_connector_url` error code.

    UpdateTeamsEndpointRequest:
      type: object
      properties:
        label:
          type: string
          nullable: true
        webhook_url:
          type: string
          format: uri
          nullable: true

    # -------------------------------------------------------------------------
    # Discord
    # -------------------------------------------------------------------------

    DiscordEndpointResponse:
      type: object
      description: Discord webhook endpoint configuration.
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        webhook_url_prefix:
          type: string
          description: First 30 characters of the webhook URL for recognition only — full URL never returned.
        default_username:
          type: string
          nullable: true
          description: Default bot username shown in Discord. Overridden per-send via template data.
        default_avatar_url:
          type: string
          nullable: true
          description: Default bot avatar URL. Overridden per-send via template data.
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_failure_at:
          type: string
          format: date-time
          nullable: true
        last_failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    DiscordEndpointListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DiscordEndpointResponse'

    CreateDiscordEndpointRequest:
      type: object
      required: [label, webhook_url]
      properties:
        label:
          type: string
        webhook_url:
          type: string
          format: uri
          description: |
            Discord webhook URL. Must match `https://discord.com/api/webhooks/{id}/{token}`
            (also accepts `discordapp.com` alias).
        default_username:
          type: string
          nullable: true
        default_avatar_url:
          type: string
          nullable: true

    UpdateDiscordEndpointRequest:
      type: object
      properties:
        label:
          type: string
          nullable: true
        webhook_url:
          type: string
          format: uri
          nullable: true
        default_username:
          type: string
          nullable: true
        default_avatar_url:
          type: string
          nullable: true

    # -------------------------------------------------------------------------
    # Workflows
    # -------------------------------------------------------------------------

    Workflow:
      type: object
      description: A named, versioned, per-environment notification workflow.
      required: [id, key, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Stable slug, unique per environment. Pattern `^[a-z][a-z0-9_]{0,99}$`.
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, active, disabled]
        created_at:
          type: string
          format: date-time

    WorkflowSummaryResponse:
      type: object
      required: [id, key, name, status, trigger_count_7d, created_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, active, disabled]
        active_version:
          type: integer
          nullable: true
        trigger_count_7d:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    WorkflowDetailResponse:
      type: object
      required: [id, key, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, active, disabled]
        active_version:
          type: integer
          nullable: true
        active_body_json:
          type: string
          nullable: true
          description: Raw JSON body of the currently active version, or null if none.
        created_at:
          type: string
          format: date-time

    WorkflowVersion:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer

    WorkflowVersionSummary:
      type: object
      required: [version, created_at]
      properties:
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
          nullable: true
        deactivated_at:
          type: string
          format: date-time
          nullable: true

    WorkflowVersionDetail:
      type: object
      required: [version, body_json, created_at]
      properties:
        version:
          type: integer
        body_json:
          type: string
          description: Raw JSON DSL body of this version.
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
          nullable: true
        deactivated_at:
          type: string
          format: date-time
          nullable: true

    CreateWorkflowRequest:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,99}$'
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 500
          nullable: true

    CreateWorkflowVersionRequest:
      type: object
      required: [body_json]
      properties:
        body_json:
          type: string
          description: |
            Full workflow definition JSON. Must conform to the workflow DSL
            schema (fetch from `GET /workflows/schema.json`). The server
            runs the structural parser at creation time; semantic validation
            (category existence, template bodies, expression syntax) runs
            only at activation.

    ActivateWorkflowVersionResponse:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowValidationError'

    WorkflowValidationError:
      type: object
      required: [code, message, pointer]
      properties:
        code:
          type: string
          description: |
            Machine-readable error code. Known codes: `unknown_category`,
            `template_body_missing`, `delay_requires_duration_or_until`,
            `delay_duration_xor_until`, `invalid_duration`, `invalid_expression`,
            `goto_target_not_found`, `unreachable_step`, `synchronous_cycle`,
            `at_requires_timezone`, `unknown_timezone`, `event_required`,
            `invalid_max_items`, `duplicate_step_id`, `unknown_channel`.
        message:
          type: string
          description: Human-readable description of the error.
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the offending location in the body JSON.

    PromoteTemplateRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false
          description: If true, return the diff without writing to Live.

    PromoteWorkflowRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false
          description: If true, return the diff and cascade candidates without writing to Live.
        include_templates:
          type: array
          items:
            type: string
          description: |
            Keys of referenced templates to promote into Live in the same
            transaction, before the workflow version is validated and activated.

    PromotionStatus:
      type: string
      enum: [new, changed, identical]
      description: |
        `new` — the key does not yet exist in Live. `changed` — it exists in
        Live and differs. `identical` — it exists and matches, so promotion is
        a no-op.

    FieldChangeKind:
      type: string
      enum: [added, removed, modified, unchanged]

    TemplateBodyChange:
      type: object
      required: [channel, subject, text, html, structured]
      properties:
        channel:
          type: string
        subject:
          $ref: '#/components/schemas/FieldChangeKind'
        text:
          $ref: '#/components/schemas/FieldChangeKind'
        html:
          $ref: '#/components/schemas/FieldChangeKind'
        structured:
          $ref: '#/components/schemas/FieldChangeKind'

    TemplatePromotionDiff:
      type: object
      required: [key, status, name, bodies]
      properties:
        key:
          type: string
        status:
          $ref: '#/components/schemas/PromotionStatus'
        name:
          $ref: '#/components/schemas/FieldChangeKind'
        bodies:
          type: array
          items:
            $ref: '#/components/schemas/TemplateBodyChange'

    WorkflowPromotionDiff:
      type: object
      required: [key, status, name, description, body, referenced_templates]
      properties:
        key:
          type: string
        status:
          $ref: '#/components/schemas/PromotionStatus'
        name:
          $ref: '#/components/schemas/FieldChangeKind'
        description:
          $ref: '#/components/schemas/FieldChangeKind'
        body:
          $ref: '#/components/schemas/FieldChangeKind'
        source_version:
          type: integer
          nullable: true
          description: The active Test version number being promoted.
        target_current_version:
          type: integer
          nullable: true
          description: The currently active Live version number, if any.
        referenced_templates:
          type: array
          description: Per-referenced-template diff against Live; the cascade candidates.
          items:
            $ref: '#/components/schemas/TemplatePromotionDiff'

    PromotionResult:
      type: object
      required: [applied, status]
      properties:
        applied:
          type: boolean
          description: True when the promotion was written; false for dry runs and no-op (`identical`) promotions.
        status:
          $ref: '#/components/schemas/PromotionStatus'
        template_diff:
          $ref: '#/components/schemas/TemplatePromotionDiff'
        workflow_diff:
          $ref: '#/components/schemas/WorkflowPromotionDiff'
        target_version:
          type: integer
          nullable: true
          description: For workflow promotions, the new Live version number that was created and activated.

    WorkflowTriggerRequest:
      type: object
      required: [trigger_data]
      properties:
        trigger_data:
          type: object
          description: Arbitrary JSON object passed as the run's trigger payload.
          additionalProperties: true

    WorkflowTriggerResponse:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, waiting, completed, failed, cancelling, cancelled]

    WorkflowRunResponse:
      type: object
      required: [id, workflow_key, version, status, trigger_data, source, created_at, steps]
      properties:
        id:
          type: string
          format: uuid
        workflow_key:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [pending, running, waiting, completed, failed, cancelling, cancelled]
        current_step_id:
          type: string
          nullable: true
        trigger_data:
          type: string
          description: Raw JSON string of the trigger payload.
        source:
          type: string
          enum: [Production, Test]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepRunSummary'

    WorkflowRunSummary:
      type: object
      required: [id, workflow_key, status, source, created_at]
      properties:
        id:
          type: string
          format: uuid
        workflow_key:
          type: string
        status:
          type: string
          enum: [pending, running, waiting, completed, failed, cancelling, cancelled]
        source:
          type: string
          enum: [Production, Test]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    ListWorkflowRunsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunSummary'
        next_page_token:
          type: string
          nullable: true
          description: Opaque cursor. Pass as `page_token` query param to retrieve the next page.

    WorkflowStepRunSummary:
      type: object
      required: [step_id, kind, attempt_id, status, started_at]
      properties:
        step_id:
          type: string
        kind:
          type: string
          enum: [send, delay, branch, digest, wait_for_event, cancel, noop]
        attempt_id:
          type: integer
        status:
          type: string
          enum: [running, waiting, completed, failed, cancelled]
        outcome:
          type: string
          enum: [sent, suppressed, branched, delayed, event_received, timed_out, failed, cancelled, noop]
          nullable: true
        notification_id:
          type: string
          format: uuid
          nullable: true
        output_json:
          type: string
          nullable: true
          description: JSON snapshot of the step output captured at completion.
        next_step_id:
          type: string
          nullable: true
        next_scheduled_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    PostWorkflowEventRequest:
      type: object
      required: [event_name, event_data]
      properties:
        event_name:
          type: string
          maxLength: 200
          description: Name of the event to deliver (e.g. `payment_confirmed`).
        event_data:
          type: object
          description: Arbitrary JSON payload matched against the step's `match` filter.
          additionalProperties: true

    PostWorkflowEventResponse:
      type: object
      required: [awoken_run_count]
      properties:
        awoken_run_count:
          type: integer
          description: Number of runs that were awoken by this event.

    # -------------------------------------------------------------------------
    # Status page
    # -------------------------------------------------------------------------

    ServiceStatusResponse:
      type: object
      required: [status, checked_at, components, active_incidents, recent_incidents]
      properties:
        status:
          type: string
          enum: [operational, degraded, partial_outage, major_outage, under_maintenance]
          description: Overall service status — worst-case across all components.
        checked_at:
          type: string
          format: date-time
          description: UTC timestamp of when the response was generated.
        components:
          type: array
          description: Per-product component statuses.
          items:
            $ref: '#/components/schemas/StatusComponentSummary'
        active_incidents:
          type: array
          description: Currently open incidents (not yet resolved).
          items:
            $ref: '#/components/schemas/IncidentSummary'
        recent_incidents:
          type: array
          description: Incidents resolved within the last 14 days.
          items:
            $ref: '#/components/schemas/IncidentSummary'

    StatusComponentSummary:
      type: object
      required: [key, name, status]
      properties:
        key:
          type: string
          description: Machine identifier (e.g. `notify`).
        name:
          type: string
          description: Display name (e.g. `Notify`).
        status:
          type: string
          enum: [operational, degraded, partial_outage, major_outage, under_maintenance]

    IncidentSummary:
      type: object
      required: [id, title, impact, current_status, started_at, updates]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        impact:
          type: string
          enum: [minor, major, critical]
        current_status:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        started_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        updates:
          type: array
          description: Timestamped admin-authored updates in reverse-chronological order.
          items:
            $ref: '#/components/schemas/IncidentUpdateSummary'

    IncidentUpdateSummary:
      type: object
      required: [status, body, created_at]
      properties:
        status:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        body:
          type: string
          description: Human-readable update text.
        created_at:
          type: string
          format: date-time
