          description: List of event types to deliver (empty means all events).
        description:
          type: string
          nullable: true
        timeout_seconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 30

    UpdateWebhookEndpointRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          nullable: true
        event_filters:
          type: array
          items:
            type: string
          nullable: true
        description:
          type: string
          nullable: true
