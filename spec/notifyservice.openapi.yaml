  # ---------------------------------------------------------------------------

  /oauth/slack/install:
    get:
      operationId: StartSlackOAuth
      tags: [Slack]
      summary: Start the Slack OAuth 2.0 installation flow
      description: |
        Requires an active dashboard session (cookie auth). Redirects the
        browser to Slack's authorization URL with a JWE-encrypted state token.
      parameters:
        - name: env_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
      responses:
        '302':
          description: Redirects to Slack's authorization page.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /oauth/slack/callback:
    get:
      operationId: CompleteSlackOAuth
      tags: [Slack]
      summary: Slack OAuth 2.0 callback — completes the installation
      description: |
        Slack redirects back here after user approval. On success redirects to
        `/dashboard/settings/slack?installed=1&team=<team_name>`. On failure
        redirects to `/dashboard/settings/slack?error=<code>`.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
      responses:
        '302':
          description: Redirects to the dashboard Slack settings page.
        '401':
          $ref: '#/components/responses/Unauthorized'

