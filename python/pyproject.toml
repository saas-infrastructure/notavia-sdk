[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notavia"
version = "1.0.2"
description = "Official Python SDK for Notavia — send transactional notifications and manage templates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["urllib3>=2.1,<3", "pydantic>=2,<3", "python-dateutil>=2.8"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-httpserver>=1.0"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["notifyservice*", "notifyservice_api*"]
