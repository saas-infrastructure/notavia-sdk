          nullable: true
        text_template:
          type: string
          nullable: true
        html_template:
          type: string
          nullable: true
        structured_template:
          type: string
          nullable: true
          description: |
            JSON string containing the channel-specific structured body. For Slack
            this is a Block Kit blocks array rendered via Liquid. For Teams this is
            an Adaptive Card v1.5 object rendered via Liquid. For Discord this is an
            embed object rendered via Liquid.

    RenderTemplateResponse:
      type: object
      properties:
        subject:
          type: string
        html_body:
          type: string
        text_body:
          type: string
          nullable: true

