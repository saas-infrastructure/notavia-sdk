openapi: 3.1.0
info:
  title: Notavia API
  version: 1.0.0
  description: |
    White-label notification engine. Authenticate with a bearer API key issued
    per environment. All `/v1/*` paths require `Authorization: Bearer <api_key>`.

    The OAuth install/callback routes (`/oauth/slack/*`) require cookie
    authentication (dashboard session) rather than an API key.

servers:
  - url: https://your-notavia-host
    description: Self-hosted deployment

security:
  - apiKey: []

tags:
  - name: Notifications
    description: Send and query notification records.
  - name: Usage
    description: Current-period send usage and plan limits.
  - name: Templates
    description: Manage notification templates and per-channel bodies.
  - name: Inbox
    description: End-user in-app inbox (uses short-lived inbox JWT, not API key).
  - name: Preferences
    description: Notification category definitions and per-user opt-in cells.
  - name: Webhooks
    description: Outbound webhook endpoints for notification lifecycle events.
  - name: Suppressions
    description: Per-environment blocklist of email addresses (bounces, complaints, manual).
  - name: SMS
    description: SMS provider configuration per environment.
  - name: Slack
    description: Slack workspace installations via OAuth 2.0.
  - name: Teams
    description: Microsoft Teams webhook endpoints.
  - name: Discord
    description: Discord webhook endpoints.
  - name: Workflows
    description: Per-tenant versioned JSON workflow engine — author, activate, trigger, and observe multi-step notification flows.
  - name: Internal
    description: Internal tooling endpoints (anonymous, non-versioned).

paths:

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------

  /v1/notifications:
    post:
      operationId: SendNotification
      tags: [Notifications]
      summary: Send a notification
      description: |
        Persists the notification and dispatches it via the requested channel.
        Returns `202 Accepted` on the first successful call. Returns `200 OK`
        when the same `Idempotency-Key` is replayed within 24 hours.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '202':
          description: Notification accepted and queued for dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '200':
          description: Idempotent replay — previously accepted notification returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - apiKey: []

    get:
      operationId: ListNotifications
      tags: [Notifications]
      summary: List notifications with cursor pagination
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, sending, sent, failed, suppressed, delivered, bounced, complained]
        - name: recipient
          in: query
          schema:
            type: string
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/notifications/{id}:
    get:
      operationId: GetNotification
      tags: [Notifications]
      summary: Get a notification by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Usage
  # ---------------------------------------------------------------------------

  /v1/usage:
    get:
      operationId: GetUsage
      tags: [Usage]
      summary: Get current-period usage and plan limits
      description: |
        Returns the calling organization's live (non-test) send usage for the
        current calendar-month billing period, the resolved plan, its included
        send allowance, and a per-channel breakdown. Test-environment sends are
        not counted. Readable by any valid API key.
      security:
        - apiKey: []
      responses:
        '200':
          description: Current-period usage and plan limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Suppressions
  # ---------------------------------------------------------------------------

  /v1/suppressions:
    get:
      operationId: ListSuppressions
      tags: [Suppressions]
      summary: List suppressed addresses with cursor pagination
      description: |
        Returns a cursor-paginated list of suppressed addresses for the
        authenticated environment. Requires a full-access API key.
      parameters:
        - name: address
          in: query
          description: Filter to entries whose address equals this value.
          schema:
            type: string
        - name: reason
          in: query
          description: |
            Filter by suppression reason (case-insensitive). Note these filter
            values are the enum names, distinct from the snake_case values
            returned in the `reason` response field.
          schema:
            type: string
            enum: [HardBounce, Complaint, ManualAdd]
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of suppressed addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: AddSuppression
      tags: [Suppressions]
      summary: Manually add an address to the suppression list
      description: |
        Manually adds an address to the suppression list. If the address is
        already suppressed, the existing entry is returned with `200` instead of
        `201`. Requires a full-access API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSuppressionRequest'
      responses:
        '201':
          description: The address was added to the suppression list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionResponse'
        '200':
          description: The address was already suppressed; the existing entry is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/suppressions/{address}:
    get:
      operationId: GetSuppression
      tags: [Suppressions]
      summary: Get a suppression by address
      description: Requires a full-access API key.
      parameters:
        - name: address
          in: path
          required: true
          description: The email address to look up. URL-encode special characters.
          schema:
            type: string
      responses:
        '200':
          description: The suppression entry for the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: RemoveSuppression
      tags: [Suppressions]
      summary: Remove an address from the suppression list
      description: Requires a full-access API key.
      parameters:
        - name: address
          in: path
          required: true
          description: The email address to remove. URL-encode special characters.
          schema:
            type: string
      responses:
        '204':
          description: The address was removed from the suppression list.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Templates
  # ---------------------------------------------------------------------------

  /v1/templates:
    post:
      operationId: CreateTemplate
      tags: [Templates]
      summary: Create a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      operationId: ListTemplates
      tags: [Templates]
      summary: List templates with cursor pagination
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/templates/{key}:
    get:
      operationId: GetTemplate
      tags: [Templates]
      summary: Get a template by key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: UpdateTemplate
      tags: [Templates]
      summary: Update fields on an existing template
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
      responses:
        '200':
          description: Updated template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: DeleteTemplate
      tags: [Templates]
      summary: Delete a template
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/templates/{key}/render:
    post:
      operationId: RenderTemplate
      tags: [Templates]
      summary: Render a template with sample data (does not send)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Rendered output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderTemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/templates/{key}/promote:
    post:
      operationId: PromoteTemplate
      tags: [Templates]
      summary: Promote a template from Test to Live
      description: |
        Copies the template — and all of its channel bodies — from the Test
        environment into Live, matched by `key`: created when the key does not
        yet exist in Live, otherwise overwritten. With `dry_run` the diff is
        returned without writing. A promotion whose result is `identical` is a
        no-op.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteTemplateRequest'
      responses:
        '200':
          description: Promotion result. The diff is returned for both dry runs and applied promotions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/templates/{id}/bodies/{channel}:
    put:
      operationId: PutTemplateChannelBody
      tags: [Templates]
      summary: Create or replace a channel body for a template
      description: |
        Upserts the body for the given channel. `channel` must be one of:
        `email`, `in_app`, `sms`, `slack`, `teams`, `discord`.
        Returns `200 OK` when updating an existing body; `201 Created` when
        creating one for the first time.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: channel
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/NotificationChannelKebab'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutTemplateBodyRequest'
      responses:
        '200':
          description: Body updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateChannelBodyResponse'
        '201':
          description: Body created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateChannelBodyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: DeleteTemplateChannelBody
      tags: [Templates]
      summary: Delete a channel body from a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: channel
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/NotificationChannelKebab'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # Inbox (end-user; uses inbox JWT not API key)
  # ---------------------------------------------------------------------------

  /inbox/v1/tokens/verify:
    post:
      operationId: VerifyInboxToken
      tags: [Inbox]
      summary: Verify an inbox JWT and return the resolved identity
      security:
        - inboxJwt: []
      responses:
        '200':
          description: Verified identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /inbox/v1/feed:
    get:
      operationId: GetInboxFeed
      tags: [Inbox]
      summary: Get the paginated in-app notification feed for the current user
      security:
        - inboxJwt: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, read, unread]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Inbox feed page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxFeedPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /inbox/v1/notifications/{id}:
    get:
      operationId: GetInboxItem
      tags: [Inbox]
      summary: Get a single inbox item
      security:
        - inboxJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inbox item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inbox/v1/notifications/{id}/read:
    post:
      operationId: MarkInboxItemRead
      tags: [Inbox]
      summary: Mark an inbox item as read
      security:
        - inboxJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkReadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inbox/v1/notifications/mark-all-read:
    post:
      operationId: MarkAllInboxItemsRead
      tags: [Inbox]
      summary: Mark all inbox items as read (optionally scoped to a cutoff time)
      security:
        - inboxJwt: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                before:
                  type: string
                  format: date-time
                  description: Only mark items created before this timestamp as read.
      responses:
        '200':
          description: Bulk-mark result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /inbox/v1/unread-count:
    get:
      operationId: GetInboxUnreadCount
      tags: [Inbox]
      summary: Get the unread notification count for the current user
      security:
        - inboxJwt: []
      responses:
        '200':
          description: Unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Preferences
  # ---------------------------------------------------------------------------

  /v1/preferences/categories:
    get:
      operationId: ListCategories
      tags: [Preferences]
      summary: List notification categories
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Categories list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: CreateCategory
      tags: [Preferences]
      summary: Create a notification category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/preferences/categories/{key}:
    put:
      operationId: UpdateCategory
      tags: [Preferences]
      summary: Update a notification category
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: ArchiveCategory
      tags: [Preferences]
      summary: Archive a notification category
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Archived.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/preferences/users/{externalUserId}:
    get:
      operationId: GetUserPreferences
      tags: [Preferences]
      summary: Get effective preferences for a user
      parameters:
        - name: externalUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Effective preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      operationId: BulkSetUserPreferences
      tags: [Preferences]
      summary: Bulk-upsert preference cells for a user
      parameters:
        - name: externalUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSetUserPreferencesRequest'
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/preferences/users/{externalUserId}/{categoryKey}/{channel}:
    patch:
      operationId: PatchUserPreference
      tags: [Preferences]
      summary: Set a single preference cell for a user
      parameters:
        - name: externalUserId
          in: path
          required: true
          schema:
            type: string
        - name: categoryKey
          in: path
          required: true
          schema:
            type: string
        - name: channel
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/NotificationChannelKebab'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opted_in]
              properties:
                opted_in:
                  type: boolean
      responses:
        '200':
          description: Updated preference cell.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------------------
  # Webhooks
  # ---------------------------------------------------------------------------

  /v1/webhook-endpoints:
    get:
      operationId: ListWebhookEndpoints
      tags: [Webhooks]
      summary: List webhook endpoints
      responses:
        '200':
          description: Webhook endpoints list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

