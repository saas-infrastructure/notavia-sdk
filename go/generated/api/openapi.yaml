      operationId: GetWorkflowVersion
      parameters:
      - $ref: '#/components/parameters/WorkflowKey'
      - explode: false
        in: path
        name: "n"
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionDetail'
          description: Version detail returned.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get a specific workflow version
      tags:
      - Workflows
  /v1/workflows/{key}/versions/{n}/activate:
    post:
      description: |
        Runs the full semantic validator against the version body. If
        `dry_run=true` the result is returned without persisting the status
        change — useful for the dashboard "Validate" button. Without
        `dry_run`, a valid version is promoted to `Active` and the previous
        active version (if any) is deactivated.
      operationId: ActivateWorkflowVersion
      parameters:
      - $ref: '#/components/parameters/WorkflowKey'
      - explode: false
        in: path
        name: "n"
        required: true
        schema:
          type: integer
        style: simple
      - description: "If true, validate without changing persistent state."
        explode: true
        in: query
        name: dry_run
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateWorkflowVersionResponse'
          description: Validation result (always returned; `valid` indicates whether
            activation succeeded).
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Activate a draft version (or dry-run validate it)
      tags:
      - Workflows
  /v1/workflows/{key}/promote:
    post:
      description: |
        Promotes the currently active Test version of the workflow into Live as
        a new version and activates it; the previous Live version is retained
        for rollback. Referenced templates that are missing or out of date in
        Live can be promoted in the same atomic operation via
        `include_templates`. With `dry_run` the diff and cascade candidates are
        returned without writing.
      operationId: PromoteWorkflow
      parameters:
      - $ref: '#/components/parameters/WorkflowKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteWorkflowRequest'
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResult'
          description: Promotion result. The diff is returned for both dry runs and
            applied promotions.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The promoted version failed semantic validation against the
            Live environment.
      summary: Promote a workflow's active version from Test to Live
      tags:
      - Workflows
  /v1/workflows/{key}/trigger:
    post:
      description: |
        Creates a new `WorkflowRun` and enqueues the first step for
        execution. Idempotent when an `Idempotency-Key` header is supplied —
        re-sending the same key within 24 hours returns the original run
        without re-triggering.
      operationId: TriggerWorkflow
      parameters:
      - $ref: '#/components/parameters/WorkflowKey'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              trigger_data:
                invoice_id: inv_42
                amount_cents: 9900
                user:
                  external_user_id: usr_1
                  email: alice@example.com
                  phone: "+15005550006"
                  name: Alice
            schema:
              $ref: '#/components/schemas/WorkflowTriggerRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
          description: Run created and first step enqueued.
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
          description: Idempotent replay — existing run returned.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Trigger data failed `trigger_data_schema` validation.
      summary: Trigger a workflow run
      tags:
      - Workflows
  /v1/workflows/{key}/runs:
    get:
      operationId: ListWorkflowRuns
      parameters:
      - $ref: '#/components/parameters/WorkflowKey'
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - running
          - waiting
          - completed
          - failed
          - cancelling
          - cancelled
          type: string
        style: form
      - description: Filter runs whose trigger data contains this `external_user_id`.
        explode: true
        in: query
        name: external_user_id
        required: false
        schema:
          type: string
        style: form
      - description: Opaque cursor returned by a previous list response.
        explode: true
        in: query
        name: page_token
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowRunsResponse'
          description: Paginated run list returned.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: List runs for a workflow with cursor pagination
      tags:
      - Workflows
  /v1/workflows/{key}/events:
    post:
      description: |
        Delivers `event_name` to every run of this workflow currently in
        `Waiting` status (paused on a `wait_for_event` step whose `event`
        and `match` filter matches). Returns the number of runs awoken.
      operationId: PostWorkflowKeyEvent
      parameters:
      - $ref: '#/components/parameters/WorkflowKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostWorkflowEventRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostWorkflowEventResponse'
          description: Event delivered; awoken run count returned.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Post an event to all waiting runs of a workflow
      tags:
      - Workflows
  /v1/workflows/runs/{runId}:
    get:
      operationId: GetWorkflowRun
      parameters:
      - explode: false
        in: path
        name: runId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                workflow_key: invoice_paid
                version: 3
                status: Waiting
                current_step_id: step_wait_payment
                trigger_data: "{\"invoice_id\":\"inv_42\",\"user\":{\"external_user_id\"\
                  :\"usr_1\"}}"
                source: Production
                created_at: 2026-05-30T14:22:11Z
                completed_at: null
                failure_reason: null
                steps:
                - step_id: step_in_app
                  kind: Send
                  attempt_id: 1
                  status: Completed
                  outcome: Sent
                  notification_id: 1fa85f64-5717-4562-b3fc-2c963f66afa7
                  output_json: "{\"id\":\"1fa85f64-5717-4562-b3fc-2c963f66afa7\",\"\
                    status\":\"Sent\",\"sent_at\":\"2026-05-30T14:22:12Z\"}"
                  next_step_id: step_wait_read
                  next_scheduled_at: null
                  started_at: 2026-05-30T14:22:12Z
                  completed_at: 2026-05-30T14:22:12Z
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
          description: Run detail with step timeline returned.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get a run with the full step timeline
      tags:
      - Workflows
  /v1/workflows/runs/{runId}/cancel:
    post:
      description: |
        Transitions the run to `Cancelling` (or immediately `Cancelled` if
        already in a terminal-adjacent state). Any scheduled `wait_for_event`
        timeout jobs are cancelled. Running Hangfire step jobs detect the
        cancellation flag and terminate cleanly.
      operationId: CancelWorkflowRun
      parameters:
      - explode: false
        in: path
        name: runId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelWorkflowRun_200_response'
          description: Cancellation requested; current status returned.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Cancel an in-progress run
      tags:
      - Workflows
  /v1/workflows/runs/{runId}/events:
    post:
      description: |
        Delivers `event_name` to a single run. Wakes the run if it is
        currently paused on a `wait_for_event` step whose `event` and
        `match` filter matches the posted data.
      operationId: PostRunEvent
      parameters:
      - explode: false
        in: path
        name: runId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostWorkflowEventRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostWorkflowEventResponse'
          description: Event delivered; awoken run count returned.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Post an event to a specific run
      tags:
      - Workflows
  /workflows/schema.json:
    get:
      description: |
        Returns the embedded `workflow.schema.json` resource. Used by the
        dashboard Monaco editor to provide structural validation and
        auto-complete. Anonymous access; cached aggressively
        (`Cache-Control: public, max-age=3600`). A `X-Schema-Sha256` response
        header carries the SHA-256 of the content for cache invalidation.
      operationId: GetWorkflowSchema
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: JSON Schema document returned.
      security: []
      summary: Fetch the workflow DSL JSON Schema
      tags:
      - Internal
  /status:
    get:
      description: |
        Returns the current operational status of the service, per-component
        statuses, any active incidents, and incidents resolved within the last
        14 days. Anonymous access; no API key required. CORS-enabled for any
        origin (`InboxEmbeddable` policy).
      operationId: GetServiceStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatusResponse'
          description: Current service status.
      security: []
      summary: Public service status
      tags:
      - Internal
  /sso/discover:
    get:
      description: |
        Given a work email, returns whether the email's domain has an active
        enterprise SSO configuration and, if so, which protocol and whether
        force-SSO is enabled. Used by the dashboard login page to offer a
        "Continue with SSO" button and to hide the password field when
        force-SSO is on. Anonymous access; returns `{ "hasSso": false }` for
        unknown domains so it does not double as an account-existence oracle.
      operationId: DiscoverSso
      parameters:
      - explode: true
        in: query
        name: email
        required: true
        schema:
          format: email
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverSso_200_response'
          description: Discovery result.
      security: []
      summary: Discover the SSO configuration for an email address's domain
      tags:
      - Internal
components:
  parameters:
    ResourceId:
      explode: false
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    WorkflowKey:
      description: "Workflow key — lowercase alphanumeric + underscore, max 100 chars."
      explode: false
      in: path
      name: key
      required: true
      schema:
        pattern: "^[a-z][a-z0-9_]{0,99}$"
        type: string
      style: simple
    IdempotencyKey:
      description: |
        Client-generated key (UUID recommended). Repeat requests with the same
        key within 24 hours return the original response without re-sending.
      explode: false
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
      style: simple
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Validation or request error.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Missing or invalid credentials.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Credentials do not have the required scope.
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Resource not found.
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: "Conflict (e.g. duplicate key, idempotency collision)."
  schemas:
    NotificationChannel:
      description: Notification channel identifier.
      enum:
      - email
      - in_app
      - webhook
      - sms
      - slack
      - teams
      - discord
      type: string
    NotificationChannelKebab:
      description: Kebab-case channel identifier used in URL path segments and template
        body keys.
      enum:
      - email
      - in_app
      - sms
      - slack
      - teams
      - discord
      type: string
    NotificationStatus:
      enum:
      - queued
      - sending
      - sent
      - failed
      - suppressed
      - delivered
      - bounced
      - complained
      type: string
    UsageResponse:
      description: Current-period live usage and resolved plan limits.
      example:
        period_end: 2000-01-23T04:56:07.000+00:00
        remaining_sends: 1
        period_start: 2000-01-23T04:56:07.000+00:00
        by_channel:
          key: 5
        plan: plan
        included_sends: 0
        used_sends: 6
        hard_limit: true
      properties:
        plan:
          description: "Resolved plan key (e.g. `free`, `oem`)."
          type: string
        period_start:
          description: Inclusive UTC start of the current billing period (first of
            the month).
          format: date-time
          type: string
        period_end:
          description: Exclusive UTC end of the current billing period (first of the
            next month).
          format: date-time
          type: string
        included_sends:
          description: "Monthly included send allowance, or null for unmetered plans."
          format: int64
          type: integer
          nullable: true
        used_sends:
          description: Live (non-test) sends consumed in the current period.
          format: int64
          type: integer
        remaining_sends:
          description: "Sends remaining before the cap, or null when there is no cap."
          format: int64
          type: integer
          nullable: true
        hard_limit:
          description: "When true, sends are rejected once the included allowance\
            \ is exhausted."
          type: boolean
        by_channel:
          additionalProperties:
            format: int64
            type: integer
          description: "Live sends consumed in the current period, keyed by lowercase\
            \ channel name."
      required:
      - by_channel
      - hard_limit
      - period_end
      - period_start
      - plan
      - used_sends
    ErrorBody:
      example:
        code: code
        param: param
        type: type
        message: message
      properties:
        type:
          type: string
        code:
          type: string
        message:
          type: string
        param:
          type: string
          nullable: true
      required:
      - code
      - message
      - type
    ErrorEnvelope:
      example:
        error:
          code: code
          param: param
          type: type
          message: message
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    SendTestResponse:
      example:
        notification_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        notification_id:
          format: uuid
          type: string
      required:
      - notification_id
    Recipient:
      description: |
        Identifies the notification target. At most one typed field should be
        set; the server selects the correct field based on `channel`.

        - **Email / SMS / In-app:** use `address` (email address, phone number E.164, or opaque external user id).
        - **Slack:** use `slack_user_id` (for DMs) or `slack_channel_id` (for channel posts).
        - **Teams / Discord:** use `endpoint` (the endpoint **key**, e.g. `"billing-alerts"`) or the legacy
          `teams_endpoint_id` / `discord_endpoint_id` (UUID of the configured endpoint).
        - `external_user_id` resolves the recipient via stored preference/inbox records.
        - `name` is used only for email `To:` display name and in-app display.
      example:
        teams_endpoint_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        slack_user_id: slack_user_id
        endpoint: endpoint
        address: address
        slack_channel_id: slack_channel_id
        name: name
        discord_endpoint_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        external_user_id: external_user_id
      properties:
        address:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        external_user_id:
          type: string
          nullable: true
        endpoint:
          description: |
            The **key** of a Discord or Teams endpoint (e.g. `"billing-alerts"`). Preferred over the legacy
            UUID fields. When set, `teams_endpoint_id` / `discord_endpoint_id` are ignored.
          type: string
          nullable: true
        slack_user_id:
          description: Slack user id (Uxxxxxxxx) for DM delivery. Mutually exclusive
            with `slack_channel_id`.
          type: string
          nullable: true
        slack_channel_id:
          description: Slack channel id (Cxxxxxxxx) for channel-post delivery. Mutually
            exclusive with `slack_user_id`.
          type: string
          nullable: true
        teams_endpoint_id:
          description: UUID of the `TeamsWebhookEndpoint` to send to. Legacy — prefer
            `endpoint` (the key).
          format: uuid
          type: string
          nullable: true
        discord_endpoint_id:
          description: UUID of the `DiscordWebhookEndpoint` to send to. Legacy — prefer
            `endpoint` (the key).
          format: uuid
          type: string
          nullable: true
    SendNotificationRequest:
      example:
        action_url: action_url
        template_key: template_key
        template_data:
          key: ""
        attachments:
        - filename: filename
          content_type: content_type
          content_base64: content_base64
        - filename: filename
          content_type: content_type
          content_base64: content_base64
        subject: subject
        html_body: html_body
        channel: email
        recipient:
          teams_endpoint_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          slack_user_id: slack_user_id
          endpoint: endpoint
          address: address
          slack_channel_id: slack_channel_id
          name: name
          discord_endpoint_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          external_user_id: external_user_id
        text_body: text_body
        category: category
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipient:
          $ref: '#/components/schemas/Recipient'
        subject:
          description: Email subject line. Ignored for non-email channels.
          type: string
          nullable: true
        html_body:
          description: Inline HTML body. Ignored when `template_key` is set. Email/in-app
            only.
          type: string
          nullable: true
        text_body:
          description: Inline plain-text body. Email/SMS only.
          type: string
          nullable: true
        template_key:
          description: "Key of a stored template. Required for Slack, Teams, Discord\
            \ channels."
          type: string
          nullable: true
        template_data:
          additionalProperties: true
          description: Liquid template variables merged at render time.
          type: object
          nullable: true
        action_url:
          description: Optional CTA URL surfaced in in-app notifications.
          type: string
          nullable: true
        category:
          description: Preference category key. Suppresses the send when the recipient
            has opted out.
          type: string
          nullable: true
        attachments:
          description: |
            File attachments for email notifications (email channel only).
            Maximum 10 files; maximum 15 MB per file and 15 MB total.
            File content must be base64-encoded. Bytes are stored ephemerally and
            deleted after delivery — only metadata is retained in the audit log.
          items:
            $ref: '#/components/schemas/AttachmentInput'
          type: array
          nullable: true
      required:
      - channel
      - recipient
    AttachmentInput:
      example:
        filename: filename
        content_type: content_type
        content_base64: content_base64
      properties:
        filename:
          description: "File name shown to the recipient, e.g. `\"statement.pdf\"\
            `."
          maxLength: 255
          type: string
        content_type:
          description: "MIME type of the file, e.g. `\"application/pdf\"`."
          maxLength: 255
          type: string
        content_base64:
          description: Base64-encoded file content.
          type: string
      required:
      - content_base64
      - content_type
      - filename
    AttachmentMetadata:
      example:
        filename: filename
        size_bytes: 6
        content_type: content_type
        purged: true
      properties:
        filename:
          description: Original file name.
          type: string
        content_type:
          description: MIME type of the file.
          type: string
        size_bytes:
          description: File size in bytes.
          format: int64
          type: integer
        purged:
          description: |
            True when the attachment bytes have been deleted from ephemeral storage after delivery.
            The metadata fields (filename, content_type, size_bytes) are always retained.
          type: boolean
    NotificationEventDto:
      example:
        occurred_at: 2000-01-23T04:56:07.000+00:00
        detail: detail
        type: type
      properties:
        type:
          type: string
        occurred_at:
          format: date-time
          type: string
        detail:
          type: string
          nullable: true
    NotificationResponse:
      example:
        action_url: action_url
        attempt_count: 0
        template_key: template_key
        attachments:
        - filename: filename
          size_bytes: 6
          content_type: content_type
          purged: true
        - filename: filename
          size_bytes: 6
          content_type: content_type
          purged: true
        subject: subject
        html_body: html_body
        channel: email
        created_at: 2000-01-23T04:56:07.000+00:00
        text_body: text_body
        suppression_reason: suppression_reason
        template_data:
          key: ""
        recipient:
          address: address
          name: name
        idempotency_key: idempotency_key
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        events:
        - occurred_at: 2000-01-23T04:56:07.000+00:00
          detail: detail
